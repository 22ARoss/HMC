<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMC — Reset Password</title>
    <link rel="stylesheet" href="css/login.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/controllers/resetPasswordController.js"></script>
</head>
<body>

    <div class="left-panel">
        <div class="logo-area">
            <div class="logo-box">H</div>
            <div class="logo-meta">
                <span class="brand">HMC</span>
                <span class="sub">Hollow Metal Configurator</span>
            </div>
        </div>

        <div class="hero">
            <h1>Choose a new <br>password.</h1>
            <p>Pick something strong that you haven't used elsewhere.</p>
        </div>

        <div class="left-footer">© 2026 HMC Industrial · Internal Use Only</div>
    </div>

    <div class="right-panel">
        <div class="form-wrap">
            <div class="welcome-tag">Account Recovery</div>
            <h2>Reset your password</h2>
            <p class="form-subtitle" id="reset-status">Enter and confirm your new password.</p>

            <form id="reset-form">
                <div class="field">
                    <label class="field-label" for="new-password">New password</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="11" rx="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="new-password" name="new-password" minlength="6" required>
                        <button type="button" class="eye-btn" id="toggle-pw" aria-label="Toggle password visibility">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="confirm-password">Confirm new password</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="11" rx="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="confirm-password" name="confirm-password" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="sign-in-btn" id="reset-submit-btn">Update password</button>
                <h5 class="reset-text">Changed your mind?</h5>
                <button type="button" class="reset_pwd_btn" id="back-to-login-btn">Back to sign in</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('toggle-pw').addEventListener('click', () => {
            const pw = document.getElementById('new-password');
            pw.type = pw.type === 'password' ? 'text' : 'password';
        });
        document.getElementById('back-to-login-btn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
