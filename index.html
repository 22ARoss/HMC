<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMC — Sign In</title>
    <link rel="stylesheet" href="css/login.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/services/authService.js"></script>
    <script type="module" src="js/controllers/loginController.js"></script>
</head>
<body>

    <div class="left-panel">
        <div class="logo-area">
            <div class="logo-box">H</div>
            <div class="logo-meta">
                <span class="brand">HMC</span>
                <span class="sub">Hollow Metal Configurator</span>
            </div>
        </div>

        <div class="hero">
            <h1>Configure &amp; track <br>every part and assembly.</h1>
            <p>The internal system of record for HMC part numbers and accounting IDs.</p>
        </div>

        <div class="left-footer">© 2026 HMC Industrial · Internal Use Only</div>
    </div>

    <div class="right-panel">
        <div class="form-wrap">
            <div class="welcome-tag">Welcome Back</div>
            <h2>Sign in to HMC</h2>
            <p class="form-subtitle">Use your internal credentials.</p>

            <form id="login-form">
                <div class="field">
                    <label class="field-label" for="email">Work email</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                <rect x="2" y="4" width="20" height="16" rx="2"/>
                                <path d="M2 7l10 7 10-7"/>
                            </svg>
                        </span>
                        <input type="email" id="email" name="email" placeholder="example@company.com" required>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="password">Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="11" rx="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="eye-btn" id="toggle-pw" aria-label="Toggle password visibility">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="sign-in-btn">Sign in &rarr;</button>
                <h5 class="reset-text">Forgot your password?</h5>
                <button type="button" class="reset_pwd_btn" id="reset-pwd-btn">Reset Password</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('toggle-pw').addEventListener('click', () => {
            const pw = document.getElementById('password');
            pw.type = pw.type === 'password' ? 'text' : 'password';
        });
    </script>
</body>
</html>
